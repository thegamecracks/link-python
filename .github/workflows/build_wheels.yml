name: Build

on:
  workflow_dispatch:
    inputs:
      wheel_versions:
        description: Wheel versions to build
        required: true
        default: cp39* cp310* cp311* cp312* cp313* cp314*
      allow_free_threaded:
        description: Allow free-threaded builds
        required: true
        type: boolean
      allow_prereleases:
        description: Allow pre-release builds
        required: true
        type: boolean
      publish:
        description: Publish wheels
        required: true
        type: boolean

permissions: {}

jobs:
  make_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build source distribution
        run: pipx run build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archs: auto
          - os: ubuntu-latest
            archs: aarch64
          - os: ubuntu-latest
            archs: armv7l
          - os: ubuntu-latest
            archs: ppc64le
          - os: ubuntu-latest
            archs: s390x
          - os: windows-latest
            archs: auto
          - os: windows-11-arm
            archs: auto
          - os: macos-26-intel
            archs: auto
          - os: macos-latest
            archs: auto

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up QEMU
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.archs != 'auto'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1.1
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BUILD: ${{ inputs.wheel_versions }}
          CIBW_ENABLE: ${{ inputs.allow_prereleases && 'cpython-prerelease' || '' }}
          CIBW_SKIP: ${{ !inputs.allow_free_threaded && 'cp3??t-*' || '' }}
          CIBW_TEST_REQUIRES: 'pytest>=8.4.2'
          CIBW_TEST_COMMAND: 'pytest --config-file {project}/pyproject.toml {project}/tests'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.archs }}
          path: ./wheelhouse/*.whl

  upload_wheels:
    name: Upload wheels to PyPI
    if:  ${{ inputs.publish }}
    needs: [build_wheels, make_sdist]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
