name: Build

on:
  workflow_dispatch:
    inputs:
      wheel_versions:
        description: Wheel versions to build
        required: true
        default: cp39* cp310* cp311* cp312* cp313* cp314* cp315*
      allow_free_threaded:
        description: Allow free-threaded builds
        required: true
        type: boolean
      allow_prereleases:
        description: Allow pre-release builds
        required: true
        type: boolean
      publish:
        description: Publish wheels
        required: true
        type: boolean

permissions: {}

jobs:
  make_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build source distribution
        run: pipx run build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archs: auto
          - os: ubuntu-latest
            archs: aarch64
          - os: ubuntu-latest
            archs: armv7l
          - os: ubuntu-latest
            archs: ppc64le
          - os: ubuntu-latest
            archs: s390x
          - os: windows-latest
            archs: auto
          - os: windows-11-arm
            archs: auto
          - os: macos-26-intel
            archs: auto
          - os: macos-latest
            archs: auto

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up QEMU
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.archs != 'auto'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@8c2dcd2e96041a619f5ff03c9638d7941e2553a4 # v4.3.3
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BUILD: ${{ inputs.wheel_versions }}
          CIBW_ENABLE: ${{ inputs.allow_prereleases && 'cpython-prerelease' || '' }}
          CIBW_SKIP: ${{ !inputs.allow_free_threaded && 'cp3??t-*' || '' }}
          CIBW_TEST_REQUIRES: 'pytest>=8.4.2'
          CIBW_TEST_COMMAND: 'pytest --config-file {project}/pyproject.toml {project}/tests'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.archs }}
          path: ./wheelhouse/*.whl

  upload_wheels:
    name: Upload wheels to PyPI
    if:  ${{ inputs.publish }}
    needs: [build_wheels, make_sdist]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
